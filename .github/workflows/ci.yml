# Railway waits for this check before deploying main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun run typecheck
      - run: bunx tsc --noEmit -p server
      - run: bun run test
      - run: bun run build
