# The Godot port's parity with the TypeScript rules: the recorded fixtures are current, and the port matches them.
# Separate from CI (which deploys wait on), and only when the port or the rules it mirrors change.
name: Godot

on:
  push:
    branches: [main]
    paths: [godot/**, scripts/godot-fixtures.ts, src/noise.ts, convex/islandRules.ts, .github/workflows/godot.yml]
  pull_request:
    paths: [godot/**, scripts/godot-fixtures.ts, src/noise.ts, convex/islandRules.ts, .github/workflows/godot.yml]

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      GODOT: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fixtures are current with the TypeScript
        run: bun scripts/godot-fixtures.ts && git diff --exit-code godot/tests/fixtures
      - name: Install Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT}_linux.x86_64" godot-bin
      - run: ./godot-bin --headless --path godot --import
      - run: ./godot-bin --headless --path godot --script res://tests/run_tests.gd
