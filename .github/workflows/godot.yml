# The Godot port's parity with the TypeScript: the recorded fixtures and exported data are current, and the port
# matches them.
# Separate from CI (which deploys wait on), and only when the port or the rules it mirrors change.
name: Godot

on:
  push:
    branches: [main]
    paths: [godot/**, scripts/godot-*.ts, src/noise.ts, src/models.ts, src/voxel.ts, src/econ.ts, src/species.ts, src/fishart.ts, src/landmarks.ts, src/gl/meshes.ts, src/world.ts, src/biome.ts, convex/islandRules.ts, .github/workflows/godot.yml]
  pull_request:
    paths: [godot/**, scripts/godot-*.ts, src/noise.ts, src/models.ts, src/voxel.ts, src/econ.ts, src/species.ts, src/fishart.ts, src/landmarks.ts, src/gl/meshes.ts, src/world.ts, src/biome.ts, convex/islandRules.ts, .github/workflows/godot.yml]

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      GODOT: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fixtures and exported data are current with the TypeScript
        run: |
          bun scripts/godot-fixtures.ts
          bun scripts/godot-export.ts
          git diff --exit-code -- godot/tests/fixtures godot/data
          untracked="$(git ls-files --others --exclude-standard -- godot/tests/fixtures godot/data)"
          if [ -n "$untracked" ]; then
            printf 'Untracked exported assets:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Install Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT}_linux.x86_64" godot-bin
      - run: ./godot-bin --headless --path godot --import
      - run: ./godot-bin --headless --path godot --script res://tests/run_tests.gd
      - name: The game plays end to end (catch, sell, and fit an upgrade)
        run: ./godot-bin --headless --path godot -- --autofish --autosell
      - name: And at night, when the night fish bite
        run: ./godot-bin --headless --path godot -- --clock=0.75 --autofish
